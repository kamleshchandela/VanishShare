<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- Primary SEO Meta Tags -->
    <title>VanishShare — Self-Destructing Text & Image Sharing in 120 Seconds</title>
    <meta name="description" content="VanishShare is a free, anonymous, and secure service to share text notes or images. Everything self-destructs exactly 120 seconds after creation." />
    <meta name="keywords" content="self destructing text share, secure note sharing, temporary image hosting, anonymous share code, VanishShare" />
    <meta name="author" content="VanishShare Team" />
    <link rel="canonical" href="https://vanishshare.io" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vanishshare.io" />
    <meta property="og:title" content="VanishShare — Self-Destructing Text & Image Sharing" />
    <meta property="og:description" content="Paste text or upload images anonymously. Everything auto-deletes completely after 120 seconds with a real-time countdown." />
    <meta property="og:image" content="https://vanishshare.io/og-preview.png" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vanishshare.io" />
    <meta property="twitter:title" content="VanishShare — Self-Destructing Text & Image Sharing" />
    <meta property="twitter:description" content="Paste text or upload images anonymously. Everything auto-deletes completely after 120 seconds." />
    <meta property="twitter:image" content="https://vanishshare.io/og-preview.png" />

    <!-- Google Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@550;700;800&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD WebApplication schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "VanishShare",
        "url": "https://vanishshare.io",
        "description": "Secure, anonymous self-destructing text and image sharing web application. Features 120-second deletion cron jobs and real-time countdown timers.",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
